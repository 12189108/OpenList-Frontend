name: Manual Frontend Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "前端版本号；留空获取官方最新正式版号"
        type: string
        required: false

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Build and check
        run: |
          bash build.sh --dev --no-compress --skip-i18n
          echo "version=$(cat dist/VERSION)" >> "$GITHUB_OUTPUT"
        id: build
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          # OPENLIST_FRONTEND_BUILD_MODE: dev
          # OPENLIST_FRONTEND_BUILD_COMPRESS: false

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openlist-frontend-dist-${{ steps.build.outputs.version }}
          path: dist/
          retention-days: 7
