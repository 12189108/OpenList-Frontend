# This workflow builds a rolling version of the OpenList frontend and publishes it on GitHub.
#
# This will:
#
# - Upload the release assets to GitHub (always git tagged `edge`).
#
# This workflow is triggered manually via the GitHub Actions UI.

name: Rolling Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "前端版本号；留空获取官方最新正式版号"
        type: string
        required: false
      draft:
        description: "Create draft release"
        required: false
        default: true
        type: boolean

jobs:
  rolling:
    name: Rolling Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Build Pre-release
        run: |
          chmod +x build.sh
          ./build.sh --dev --compress
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - name: Read version and determine tag name
        id: version
        run: |
          version=$(cat dist/VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag_name=edge" >> $GITHUB_OUTPUT

      - name: Remove the existing pre-release
        run: gh release delete ${{ steps.version.outputs.tag_name }} --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release on GitHub
        run: |
          gh release create \
            --title "Pre-release ${{ steps.version.outputs.version }}" \
            --notes "Pre-release build for ${{ steps.version.outputs.version }}<br>This is a development build and not intended for production use." \
            --prerelease \
            --draft=${{ inputs.draft }} \
            --target "$GITHUB_SHA" \
            ${{ steps.version.outputs.tag_name }} \
            dist/openlist-frontend-dist-v*-dev.tar.gz \
            dist/i18n.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
