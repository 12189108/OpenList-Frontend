name: Custom Frontend Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Frontend version (e.g. 4.2.6-custom.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semver
        id: semver
        uses: matt-usurp/validate-semver@v3.0.0
        with:
          version: ${{ inputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v6

      - name: Prepare release version and local tag
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Release tag already exists: v$VERSION" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "chore(release): prepare frontend v$VERSION"
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"

      - name: Build release using official translations
        run: |
          bash build.sh --release --compress --skip-i18n
          pnpm lint
          pnpm test:resumable

      - name: Push release commit and tag
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/v$VERSION"

      - name: Publish custom release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.semver.outputs.version }}
          IS_PRERELEASE: ${{ steps.semver.outputs.prerelease != '' }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "Release v$VERSION" \
            --generate-notes --prerelease="$IS_PRERELEASE" \
            "dist/openlist-frontend-dist-v$VERSION.tar.gz" dist/i18n.tar.gz
