name: Custom Frontend Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "前端版本号（可带 v）；留空获取官方最新正式版号，编译当前分支"
        required: false
        type: string
      publish:
        description: "同时发布 GitHub Release（版本标签必须尚不存在）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@v6

      - name: Compile frontend
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/build-custom.sh

      - name: Upload frontend archives
        uses: actions/upload-artifact@v4
        with:
          name: openlist-frontend-${{ steps.build.outputs.version }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Publish custom release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "标签 $VERSION 已存在，请指定新的自定义版本号。" >&2
            exit 1
          fi
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" \
            --generate-notes "${args[@]}" \
            "dist/openlist-frontend-dist-$VERSION.tar.gz" dist/i18n.tar.gz
