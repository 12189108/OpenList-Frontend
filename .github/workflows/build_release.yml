name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入版本号 (例如: 1.0.0，系统会自动加上 v 前缀)'
        required: true
        type: string

jobs:
  release:
    name: Build and Publish to GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许工作流创建 GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Format version tag
        id: format_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # 确保 tag 带有 'v' 前缀
          if [[ $VERSION != v* ]]; then
             TAG_NAME="v$VERSION"
             CLEAN_VERSION="$VERSION"
          else
             TAG_NAME="$VERSION"
             CLEAN_VERSION="${VERSION#v}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version (Local only)
        run: |
          # 仅在打包环境中更新版本号，不提交回代码库
          jq --arg version "${{ steps.format_version.outputs.clean_version }}" '.version = $version' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Create local tag for build script
        run: |
          # build.sh 需要本地存在 tag 才能顺利执行，这里配置一个临时的 git 环境并打上标签
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.format_version.outputs.tag }}" -m "Release ${{ steps.format_version.outputs.tag }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Build Release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Move regular build
        run: |
          mkdir -p regular-dist
          mv dist/* regular-dist/

      - name: Build Lite Release
        run: |
          chmod +x build.sh
          ./build.sh --release --compress --lite
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Move lite build and restore regular build
        run: |
          mkdir -p lite-dist
          mv dist/* lite-dist/
          mv regular-dist/* dist/

      - name: Create GitHub Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动发布 Release 并上传产物，由于本地已经有了 tag，gh 命令会自动推送它并使用
          gh release create "${{ steps.format_version.outputs.tag }}" \
            --title "Release ${{ steps.format_version.outputs.tag }}" \
            --generate-notes \
            dist/openlist-frontend-dist-v*.tar.gz \
            lite-dist/openlist-frontend-dist-lite-v*.tar.gz \
            dist/i18n.tar.gz
